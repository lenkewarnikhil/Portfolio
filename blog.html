  <script>
    // Theme toggle logic (sync with index.html)
    const themeBtn = document.querySelector('.theme-toggle');
    const prefersDarkScheme = window.matchMedia('(prefers-color-scheme: dark)');
    const applyTheme = (isDark) => document.body.classList.toggle('dark-mode', isDark);
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme) applyTheme(savedTheme === 'dark');
    else applyTheme(prefersDarkScheme.matches);

    themeBtn.addEventListener('click', () => {
      const isCurrentlyDark = document.body.classList.contains('dark-mode');
      applyTheme(!isCurrentlyDark);
      localStorage.setItem('theme', isCurrentlyDark ? 'light' : 'dark');
    });
    prefersDarkScheme.addEventListener('change', (e) => {
      if (!localStorage.getItem('theme')) applyTheme(e.matches);
    });

    // Mobile menu toggle
    document.querySelector('.menu-toggle').addEventListener('click', function() {
      document.querySelector('.nav-links').classList.toggle('active');
    });

    function parseMarkdown(md) {
      let html = md
        .replace(/^# (.+)$/gm, '<h1>$1</h1>')
        .replace(/^## (.+)$/gm, '<h2>$1</h2>')
        .replace(/^### (.+)$/gm, '<h3>$1</h3>')
        .replace(/```(.+?)```/gs, '<pre><code>$1</code></pre>')
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.+?)\*/g, '<em>$1</em>')
        .replace(/^\- (.+)$/gm, '<li>$1</li>')
        .replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>');
      
      return html.split('\n\n').map(para => para.startsWith('<') || !para.trim() ? '' : `<p>${para}</p>`).join('\n').replace(/\[(.+?)\]\((.+?)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    }

    async function loadBlogPost() {
      const slug = window.location.hash.replace('#blog/', '') || 'ai';
      try {
        const response = await fetch(`./assets/posts/${slug}.md`);
        if (!response.ok) throw new Error('Blog post not found');
        document.getElementById('blog-content').innerHTML = `
          <div class="back-link" style="margin-bottom: 3rem;">
            <a href="./index.html#blog" style="color: var(--primary-color); text-decoration: none; font-weight: 600; display: inline-flex; align-items: center; gap: 0.5rem;">
              <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
              Back to all blogs
            </a>
          </div>
          <article class="blog-post-article">${parseMarkdown(await response.text())}</article>
        `;
      } catch (error) {
        document.getElementById('blog-content').innerHTML = `
          <div class="back-link" style="margin-bottom: 2rem;">
            <a href="./index.html#blog" style="color: var(--primary-color); text-decoration: none; font-weight: 600;">← Back to all blogs</a>
          </div>
          <p style="color: var(--text-main);">Article not found. <a href="./index.html#blog" style="color: var(--primary-color);">Return to blogs</a></p>
        `;
      }
    }
    
    document.addEventListener('DOMContentLoaded', loadBlogPost);
    window.addEventListener('hashchange', loadBlogPost);
  </script>
